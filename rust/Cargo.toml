[package]
name = "rust_lib_workspace"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0-beta.4"
nostr = { version = "0.44.4", features = ["nip06", "nip44", "nip49", "nip59"] }
bip39 = { version = "2", features = ["rand"] }
nostr-database = "0.44.0"
nostr-lmdb = "0.44.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "http2"] }
hex = "0.4.3"
webpki-roots = "0.26"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
vodozemac = "0.10"
url = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
